name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '37'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  build:
    name: Lint, test and assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android SDK components
        run: >-
          sdkmanager --install
          "platform-tools"
          "platforms;android-${{ env.ANDROID_COMPILE_SDK }}"
          "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Show toolchain versions
        run: |
          java -version
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          sdkmanager --version

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run lint, unit tests and build debug APK
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskmind-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
